spring:
  application:
    name: loan-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    hikari:
      max-lifetime: 240000
      keepalive-time: 60000
      validation-timeout: 5000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET}

customer-service:
  url: ${CUSTOMER_SERVICE_URL}

credit-decision-service:
  url: ${CREDIT_DECISION_SERVICE_URL}

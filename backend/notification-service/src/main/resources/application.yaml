spring:
  application:
    name: notification-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


server:
  port: 8086

services:
  customer:
    url: ${CUSTOMER_SERVICE_URL}

  loan:
    url: ${LOAN_SERVICE_URL}

logging:
  level:
    org.springframework.mail: DEBUG
    org.eclipse.angus.mail: DEBUG
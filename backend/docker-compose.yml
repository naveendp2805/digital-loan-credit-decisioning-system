
services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: loan-system-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:9094,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9094,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - loan_kafka_data:/var/lib/kafka/data
    networks:
      - loan-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    env_file:
      - api-gateway/.env
    environment:
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      LOAN_SERVICE_URL: http://loan-service:8082
      CREDIT_DECISION_SERVICE_URL: http://credit-decision-service:8083
      DOCUMENT_SERVICE_URL: http://document-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      REPAYMENT_SERVICE_URL: http://repayment-service:8086
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
    ports:
      - "8080:8080"
    depends_on:
      - customer-service
      - loan-service
      - credit-decision-service
      - document-service
      - payment-service
      - repayment-service
      - notification-service
    networks:
      - loan-network

  customer-service:
    build:
      context: .
      dockerfile: customer-service/Dockerfile
    env_file:
      - customer-service/.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
    ports:
      - "8081:8081"
    depends_on:
      - kafka
    networks:
      - loan-network

  loan-service:
    build:
      context: .
      dockerfile: loan-service/Dockerfile
    env_file:
      - loan-service/.env
    environment:
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      CREDIT_DECISION_SERVICE_URL: http://credit-decision-service:8083
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
    ports:
      - "8082:8082"
    depends_on:
      - customer-service
      - credit-decision-service
      - kafka
    networks:
      - loan-network

  credit-decision-service:
    build:
      context: .
      dockerfile: credit-decision-service/Dockerfile
    env_file:
      - credit-decision-service/.env
    environment:
      LOAN_SERVICE_URL: http://loan-service:8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
    ports:
      - "8083:8083"
    depends_on:
      - kafka
    networks:
      - loan-network

  document-service:
    build:
      context: .
      dockerfile: document-service/Dockerfile
    env_file:
      - document-service/.env
    environment:
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      LOAN_SERVICE_URL: http://loan-service:8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
    ports:
      - "8084:8084"
    depends_on:
      - customer-service
      - loan-service
      - kafka
    networks:
      - loan-network

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    env_file:
      - payment-service/.env
    environment:
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      LOAN_SERVICE_URL: http://loan-service:8082
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      REPAYMENT_SERVICE_URL: http://repayment-service:8086
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
    ports:
      - "8085:8085"
    depends_on:
      - loan-service
      - customer-service
      - kafka
    networks:
      - loan-network

  repayment-service:
    build:
      context: .
      dockerfile: repayment-service/Dockerfile
    env_file:
      - repayment-service/.env
    environment:
      LOAN_SERVICE_URL: http://loan-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8085
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
    ports:
      - "8086:8086"
    depends_on:
      - loan-service
      - payment-service
      - kafka
    networks:
      - loan-network

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    env_file:
      - notification-service/.env
    environment:
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      LOAN_SERVICE_URL: http://loan-service:8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
    ports:
      - "8087:8087"
    depends_on:
      - customer-service
      - loan-service
      - kafka
    networks:
      - loan-network

  audit-service:
    build:
      context: .
      dockerfile: audit-service/Dockerfile
    env_file:
      - audit-service/.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
    ports:
      - "8088:8088"
    depends_on:
      - kafka
    networks:
      - loan-network

volumes:
  loan_kafka_data:

networks:
  loan-network:
    name: loan-system-network
    driver: bridge

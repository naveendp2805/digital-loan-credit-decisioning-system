spring:
  application:
    name: repayment-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8085

services:
  loan:
    url: ${LOAN_SERVICE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info
